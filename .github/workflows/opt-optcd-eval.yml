name: Modified CI
jobs:
  mvn:
    strategy:
      matrix:
        profile:
        - name: full-build-jdk17
          jdk: 17
          args: -Pfull-build apache-rat:check verify -DskipTests spotbugs:check checkstyle:check
      fail-fast: false
    timeout-minutes: 360
    runs-on:
    - self-hosted
    - optcd
    steps:
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install inotify
    - name: Run inotifywait
      run: |-
        python3 -c "
        import inotify.adapters
        import inotify.constants
        import os
        from datetime import datetime, timezone
        with open('/home/runner/inotifywait-log-mvn (${{ matrix.profile }}).csv', 'w') as log_file:
          i = inotify.adapters.InotifyTree('/home/runner/work/zookeeper/zookeeper', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
          for event in i.event_gen(yield_nones=False):
            (_, type_names, path, filename) = event
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
            events = ','.join(type_names)
            log_file.write(f'{now};{path};{filename};{events}\n')
            log_file.flush()
            os.fsync(log_file.fileno())
        " &
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - run: touch optcd-3.txt
    - name: Set up JDK ${{ matrix.profile.jdk }}
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
      with:
        java-version: ${{ matrix.profile.jdk }}
        distribution: temurin
        cache: maven
    - run: touch optcd-4.txt
    - name: Show the first log message
      run: git log -n1
    - run: touch optcd-5.txt
    - name: Install C Dependencies
      run: |-
        sudo apt update
        sudo apt install -y libcppunit-dev libsasl2-dev
    - run: touch optcd-6.txt
    - name: Build with Maven (${{ matrix.profile.name }})
      run: mvn -B -V -e -ntp "-Dstyle.color=always" ${{ matrix.profile.args }}
      env:
        MAVEN_OPTS: -Djansi.force=true
    - run: touch optcd-7.txt
    - name: Upload unit test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: surefire-reports-${{ matrix.profile.name }}
        path: ./**/target/surefire-reports/
        if-no-files-found: ignore
    - run: touch optcd-8.txt
    - name: Upload integration test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: failsafe-reports-${{ matrix.profile.name }}
        path: ./**/target/failsafe-reports/
        if-no-files-found: ignore
    - run: touch optcd-9.txt
    - name: Upload cppunit test logs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cppunit-logs-${{ matrix.profile.name }}
        path: ./zookeeper-client/zookeeper-client-c/target/c/TEST-*.txt
        if-no-files-found: ignore
    - run: touch optcd-10.txt
    - name: Upload inotifywait logs
      uses: actions/upload-artifact@v4
      with:
        name: inotifywait-mvn (${{ matrix.profile }})
        path: /home/runner/inotifywait-log-mvn (${{ matrix.profile }}).csv
    name: mvn (${{ matrix.profile }})
'on':
- push
- workflow_dispatch
